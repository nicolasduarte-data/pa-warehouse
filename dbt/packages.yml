# dbt packages — pa-warehouse
# Run `dbt deps` after editing to install/update.

packages:
  # Canonical dbt utility library — generic tests, cross-db macros, date_spine.
  # Used for cross-warehouse SQL (date_trunc, date_spine) so the project
  # stays portable to Snowflake without per-model SQL rewrites.
  - package: dbt-labs/dbt_utils
    version: [">=1.1.0", "<2.0.0"]

  # Project quality evaluator — auditor that checks naming conventions, test
  # coverage, documentation coverage, and model dependency hygiene. Models
  # land in their own `dbt_project_evaluator` dataset (configured in
  # dbt_project.yml) so they don't pollute the warehouse namespaces.
  # Run via: `dbt build --select package:dbt_project_evaluator`
  - package: dbt-labs/dbt_project_evaluator
    version: [">=0.13.0", "<1.0.0"]
