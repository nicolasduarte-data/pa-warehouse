version: 2

# sources.yml — raw layer source declarations for pa-warehouse.
# dbt uses these to generate {{ source('raw', 'table') }} refs, run source freshness
# checks, and build the lineage graph. Models reference sources via source(), never
# by hardcoding project.dataset.table — so if the source location ever changes,
# this file is the only place to update.

sources:
  - name: raw
    # Cross-target database resolution (paw-prey-005 Story 5.6 — Snowflake port):
    #   - dbt-bigquery exposes the GCP project as `target.project` (e.g.
    #     'pa-warehouse-prod'). It does NOT populate `target.database`.
    #   - dbt-snowflake exposes the Snowflake database as `target.database`
    #     (e.g. 'PA_WAREHOUSE'). It does NOT populate `target.project`.
    # The conditional below selects the right attribute per adapter so the
    # SAME source ref (`source('raw', 'employees')`) resolves correctly on
    # both targets without changing model SQL.
    database: "{{ target.project if target.type == 'bigquery' else target.database }}"
    schema: raw                   # case folds to RAW on Snowflake automatically
    description: >
      Raw landing zone. Data loaded by `generator/load_raw.py` (BigQuery) or
      `generator/load_raw_snowflake.py` (Snowflake) directly from generator
      output CSVs. No transformations applied — this is the truth source.

    tables:
      # ── Static dimension lookups ──────────────────────────────────────────
      - name: departments
        description: "One row per department. 8 departments. Static — no history tracked."
        columns:
          - name: dept_id
            description: "PK. Format: DEPT_NN."
            tests:
              - not_null
              - unique
          - name: dept_name
            description: "Human-readable department name."

      - name: jobs
        description: >
          One row per job code. 29 jobs across 6 job levels (IC1–IC5, M1–M2,
          Director, VP+). Includes criticality and scarcity metadata.
        columns:
          - name: job_id
            description: "PK. Format: JOB_NNN."
            tests:
              - not_null
              - unique
          - name: job_title
            description: "Full job title."
          - name: job_level
            description: "Level code (IC1, IC2, M1, etc.)."
          - name: job_family
            description: "Broad family grouping (Engineering, HR, Finance, etc.)."
          - name: is_critical_role
            description: "True if this role is flagged critical for succession planning."
          - name: skill_scarcity_tier
            description: "STANDARD / SCARCE / CRITICAL — affects regrettable-attrition risk."
          - name: band_midpoint
            description: "Salary midpoint for this job's pay band (USD, whole dollars)."

      - name: locations
        description: "One row per office location. 5 locations."
        columns:
          - name: location_id
            description: "PK. Format: LOC_NN."
            tests:
              - not_null
              - unique
          - name: location_name
            description: "City name."
          - name: location_type
            description: "OFFICE or REMOTE."
          - name: region
            description: "Geographic region (East, West, etc.)."

      # ── Employee spine ─────────────────────────────────────────────────────
      - name: employees
        description: >
          One row per employee. Current state snapshot — the latest attribute
          values at window-close. Includes org FK columns (job_id, dept_id,
          location_id, manager_id) plus terminal state (exit_date, exit_type).
          Active employees have NULL exit_date and exit_type.
        columns:
          - name: employee_id
            description: "PK. Format: EMP_NNNNN."
            tests:
              - not_null
              - unique
          - name: first_name
            description: "Synthetic first name (Faker)."
          - name: last_name
            description: "Synthetic last name (Faker)."
          - name: email
            description: "Synthetic email. Format: first.last@example.com."
          - name: hire_date
            description: "Date the employee was hired."
            tests:
              - not_null
          - name: job_id
            description: "FK to raw.jobs.job_id."
            tests:
              - not_null
              - relationships:
                  to: source('raw', 'jobs')
                  field: job_id
          - name: gender
            description: "M / F / NB. Synthetically assigned; conditional on job_level (produces 13% unadjusted pay gap)."
            tests:
              - not_null
              - accepted_values:
                  values: [M, F, NB]
          - name: birth_date
            description: >
              Immutable per-employee date of birth (paw-prey-005 Story 5.1.1).
              Back-derived from age_at_hire and hire_date in the generator
              (truncnorm μ=36 σ=10 bounds [18, 70]). Downstream marts compute
              age_at_window_close from this column at any snapshot_date.
            tests:
              - not_null
          - name: age_at_hire
            description: >
              Integer age in years at hire_date (paw-prey-005 Story 5.1.4).
              Derived from the same truncnorm draw that produced birth_date.
              Kept in the CSV alongside birth_date for analytic convenience —
              the two are mutually-derivable but co-storing avoids repeated
              date arithmetic in ad-hoc queries.
            tests:
              - not_null
              - dbt_utils.accepted_range:
                  min_value: 18
                  max_value: 70
                  inclusive: true
          - name: dept_id
            description: "FK to raw.departments.dept_id."
            tests:
              - relationships:
                  to: source('raw', 'departments')
                  field: dept_id
          - name: location_id
            description: "FK to raw.locations.location_id."
            tests:
              - relationships:
                  to: source('raw', 'locations')
                  field: location_id
          - name: manager_id
            description: "FK to raw.employees.employee_id. NULL for top-level employees (CEO, VP tier with no manager)."
          - name: perf_tier
            description: "Performance tier 1–5 at window-close. 5 = highest."
          - name: compa_ratio
            description: "Current salary / band midpoint. Centered at 1.00, std dev ~0.08."
          - name: exit_date
            description: "Date of termination. NULL for active employees."
          - name: exit_type
            description: "term_voluntary / term_involuntary / NULL (active)."

      # ── Events ────────────────────────────────────────────────────────────
      - name: workforce_events
        description: >
          One row per workforce event per employee. Ordered by event_date ascending.
          Event types: hire, promote, dept_change, mgr_change, comp_change,
          term_voluntary, term_involuntary. is_regrettable is only meaningful
          on term_voluntary rows — False on all others.
        columns:
          - name: event_id
            description: "PK. Format: EVT_NNNNNNN."
            tests:
              - not_null
              - unique
          - name: employee_id
            description: "FK to raw.employees.employee_id."
            tests:
              - not_null
              - relationships:
                  to: source('raw', 'employees')
                  field: employee_id
          - name: event_date
            description: "Date the event occurred. Always >= hire_date for the employee."
            tests:
              - not_null
          - name: event_type
            description: "Type of workforce event."
            tests:
              - not_null
              - accepted_values:
                  values:
                    - hire
                    - terminate
                    - promote
                    - dept_change
                    - mgr_change
                    - comp_change
                    - term_voluntary
                    - term_involuntary
          - name: is_regrettable
            description: >
              True if this voluntary termination is regrettable (CPT-sampled at
              generation). Always False for non-voluntary events. ~30% of
              term_voluntary rows are True (Mercer 2024 benchmark).

      # ── Transactional facts ───────────────────────────────────────────────
      - name: compensation
        description: >
          One row per compensation record per employee. Multiple records per
          employee when salary changes occur. 5,609 rows for 2,500 employees
          reflects ~2.2 average comp events per employee over 36 months.
        columns:
          - name: comp_id
            description: "PK. Format: COMP_NNNNNNN."
            tests:
              - not_null
              - unique
          - name: employee_id
            description: "FK to raw.employees.employee_id."
            tests:
              - not_null
              - relationships:
                  to: source('raw', 'employees')
                  field: employee_id
          - name: effective_date
            description: "Date this compensation record became effective."
            tests:
              - not_null
          - name: salary
            description: "Annual salary in USD."
          - name: currency
            description: "Always USD in this dataset."
          - name: pay_band_id
            description: "Pay band identifier (BAND_IC1, BAND_M1, etc.)."
          - name: compa_ratio
            description: "salary / band_midpoint at this point in time."

      - name: performance_ratings
        description: >
          One row per performance review per employee. Annual + mid-year cycles.
          7,454 rows for 2,500 employees reflects ~3 review cycles over 36 months.
        columns:
          - name: rating_id
            description: "PK. Format: RTG_NNNNNNN."
            tests:
              - not_null
              - unique
          - name: employee_id
            description: "FK to raw.employees.employee_id."
            tests:
              - not_null
              - relationships:
                  to: source('raw', 'employees')
                  field: employee_id
          - name: review_date
            description: "Date the review was completed."
            tests:
              - not_null
          - name: review_cycle
            description: "MID (mid-year) or YEAR_END (annual). Generator uses YEAR_END."
            tests:
              - accepted_values:
                  values: [MID, YEAR_END]
          - name: rating
            description: "Performance rating 1–5. 5 = highest."
          - name: potential_flag
            description: "LOW / MID / HIGH potential assessment."
            tests:
              - accepted_values:
                  values: [LOW, MID, HIGH]

      - name: survey_responses
        description: >
          One row per eNPS survey response per employee. Quarterly cadence.
          16,095 rows for 2,500 employees reflects ~6.4 survey cycles per employee.
        columns:
          - name: survey_id
            description: "PK. Format: SRV_NNNNNNN."
            tests:
              - not_null
              - unique
          - name: employee_id
            description: "FK to raw.employees.employee_id."
            tests:
              - not_null
              - relationships:
                  to: source('raw', 'employees')
                  field: employee_id
          - name: survey_date
            description: "Date the survey was completed."
            tests:
              - not_null
          - name: enps_score
            description: "Raw NPS score 0–10. Promoter ≥ 9, Detractor ≤ 6."
          - name: response_category
            description: "PROMOTER / PASSIVE / DETRACTOR — derived from enps_score."
            tests:
              - accepted_values:
                  values: [PROMOTER, PASSIVE, DETRACTOR]

      - name: succession_plan
        description: >
          One row per employee — successor readiness count and role criticality
          at window-close. Used in IsRegrettableFlag CPT: critical roles with
          zero successors have highest regrettable-attrition risk.
        columns:
          - name: succession_id
            description: "PK. Format: SUC_NNNNNNN."
            tests:
              - not_null
              - unique
          - name: employee_id
            description: "FK to raw.employees.employee_id."
            tests:
              - not_null
              - relationships:
                  to: source('raw', 'employees')
                  field: employee_id
          - name: successor_readiness_count
            description: "Number of ready successors for this employee's role. 0 = single point of failure."
          - name: is_critical_role
            description: "True if this employee occupies a critical role."
