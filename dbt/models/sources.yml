version: 2

# sources.yml — raw layer source declarations for pa-warehouse.
# dbt uses these to generate {{ source('raw', 'table') }} refs, run source freshness
# checks, and build the lineage graph. Models reference sources via source(), never
# by hardcoding project.dataset.table — so if the source location ever changes,
# this file is the only place to update.

sources:
  - name: raw
    database: pa-warehouse-prod   # GCP project ID
    schema: raw                   # BigQuery dataset name
    description: >
      Raw landing zone. Data loaded by generator/load_raw.py directly from
      generator output CSVs. No transformations applied — this is the truth source.

    tables:
      - name: employees
        description: >
          One row per employee. Loop 1 minimal schema: identity fields + hire_date.
          Loop 2 expands with compensation, performance, and org hierarchy columns.
        columns:
          - name: employee_id
            description: "Surrogate key. Format: EMP_NNNNN. Generated by generate.py."
            tests:
              - not_null
              - unique
          - name: first_name
            description: "Synthetic first name generated by Faker."
          - name: last_name
            description: "Synthetic last name generated by Faker."
          - name: email
            description: "Synthetic email. Format: first.last@example.com."
          - name: gender
            description: "Single character: M or F. Synthetically assigned."
          - name: hire_date
            description: "Date employee was hired. No events exist before this date."
            tests:
              - not_null

      - name: workforce_events
        description: >
          One row per workforce event per employee. Ordered by event_date ascending.
          In Loop 1: only 'hire' and 'terminate' event types exist.
          Loop 2 adds: promote, dept_change, mgr_change, comp_change.
          This table is the SCD2 truth source — dim_employee snapshot reads from here.
        columns:
          - name: event_id
            description: "Surrogate key. Format: EVT_NNNNNNN."
            tests:
              - not_null
              - unique
          - name: employee_id
            description: "FK to raw.employees.employee_id."
            tests:
              - not_null
              - relationships:
                  to: source('raw', 'employees')
                  field: employee_id
          - name: event_date
            description: "Date the event occurred. Always >= hire_date for the employee."
            tests:
              - not_null
          - name: event_type
            description: "Type of workforce event."
            tests:
              - not_null
              - accepted_values:
                  values:
                    - hire
                    - terminate
                    - promote
                    - dept_change
                    - mgr_change
                    - comp_change
                    - term_voluntary
                    - term_involuntary
