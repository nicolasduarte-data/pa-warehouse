# dbt_project.yml — pa-warehouse
# Per BACKLOG Story 1.3.3 — model paths + directory-level materializations
# Story 1.3 is one of the three "portfolio senior signal" markers per Research A:
# YAML completeness + schema tests + directory-level materializations.

name: 'pa_warehouse'
version: '1.0.0'
config-version: 2

# Profile name must match an entry in ~/.dbt/profiles.yml (or local profiles.yml
# alongside this file). The actual credentials live there, never here.
profile: 'pa_warehouse'

# Standard dbt-Labs project layout. Aligns with Research A's recommendation
# and the three-layer architecture: raw (declared as sources) → staging →
# core → marts.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Directory-level materialization defaults. Override per-model with
# {{ config(materialized=...) }} when needed.
#
#   staging/   → view   — cheap, no storage, always up to date
#   core/      → table  — built once per `dbt run`, used many times by marts
#   marts/     → view   — dashboard-facing, query latency target <3s on live
#                         Looker Studio connection (Research A: live mode, no
#                         100MB extract constraint)
models:
  pa_warehouse:
    staging:
      +materialized: view
      +schema: staging
    core:
      +materialized: table
      +schema: core
    marts:
      +materialized: view
      +schema: marts

# Snapshot config defaults — `target_schema` lives at the snapshot level per
# Research A. See snapshots/dim_employee_snapshot.sql for the full SCD2 config.
snapshots:
  pa_warehouse:
    +target_schema: core

# Seed config — phantom dim rows for sentinel values land here (per BACKLOG
# Story 2.8.2). Loop 1 doesn't use seeds yet.
seeds:
  pa_warehouse:
    +schema: core
